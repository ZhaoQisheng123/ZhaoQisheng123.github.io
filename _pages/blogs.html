---
layout: academic
title: Blogs
permalink: /blogs/
description: Notes and articles by Qisheng Zhao.
---

{% if site.data.blogs.size > 0 %}
{% for post in site.data.blogs %}
<article class="blog-entry">
  <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
  {% if post.summary %}<p>{{ post.summary }}</p>{% endif %}
</article>
{% endfor %}
{% else %}
<p class="empty-state">Coming soon.</p>
{% endif %}
