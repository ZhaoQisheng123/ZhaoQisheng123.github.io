- id: surgical-robotics
  title: Autonomous Surgical Robotics
  thumbnail: /images/projects/safe-toumai.jpg
  thumbnail_alt: SAFE-Toumai surgical robotics exhibition.
  thumbnail_width: 1600
  thumbnail_height: 890
  featured: true
  summary: Task planning and VLA-based skill execution for autonomous laparoscopic manipulation.
  highlights:
    - Task-network planning for multi-arm coordination and skill switching.
    - World-model-assisted data augmentation for VLA skills.
    - Constraint monitoring and online recovery during execution.
  prototype:
    title: "Related prototype: SAFE-Toumai teleoperation"
    summary: Visual–tactile feedback and assistive motion control.
    highlights:
      - "Force estimation from structured-light vision and robot dynamics, with reported error below 0.5 N."
      - Camera–arm coordination under visibility and joint-velocity constraints.
      - Hand-tremor filtering and organ-motion compensation.
  images:
