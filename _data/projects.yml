- id: task-allocation
  media_layout: stacked
  media_order: [images, videos]
  title: Fast Task Allocation & Online Replanning
  thumbnail: /images/projects/task-allocation-framework.svg
  thumbnail_alt: Three-stage algorithm framework for collaborative agents, from formal task specifications through decomposition to allocation and replanning.
  thumbnail_width: 1200
  thumbnail_height: 930
  featured: true
  summary: Constraint-aware task allocation and online replanning for heterogeneous robot teams.
  highlights:
    - LTL task modeling and partial-order decomposition for parallel execution.
    - Capability, resource, and time-window constraints for synchronized multi-robot tasks.
    - Anytime branch-and-bound search for feasible schedules and shorter makespans within a time budget.
    - Replanning unfinished tasks after agent availability changes or task additions and cancellations.
  images:
    - src: /images/projects/task-allocation-framework.svg
      alt: Formal logic task specification and prior rule integration, spatiotemporal task decomposition, and branch-and-bound allocation with online replanning for agent teams.
      width: 1200
      height: 930
      caption: Three-stage framework for multi-agent task allocation and online replanning.
  videos:
    - title: Task allocation & online replanning simulation
      src: /files/projects/task-allocation-demo.mp4
      poster: /images/projects/task-allocation-demo.jpg
      width: 1280
      height: 544
      duration: "0:18"
